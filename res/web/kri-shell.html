<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>kri</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #140c1c;
      color: #deeed6;
      font: 15px system-ui, sans-serif;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
      background: #140c1c;
    }
    #loading[hidden] { display: none; }
    #loading > div { text-align: center; }
    #loading strong { display: block; margin-bottom: .5rem; color: #dad45e; }
    #status { color: #8595a1; }
    #storage-indicator {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border: 1px solid #4e4a4e;
      border-radius: 999px;
      background: rgba(20, 12, 28, .94);
      color: #8595a1;
      font: 12px/1.2 system-ui, sans-serif;
      box-shadow: 0 4px 18px rgba(20, 12, 28, .45);
      cursor: pointer;
    }
    #storage-indicator[hidden] { display: none; }
    #storage-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #757161;
    }
    #storage-indicator[data-state="saved"] { color: #deeed6; }
    #storage-indicator[data-state="saved"] #storage-dot { background: #6daa2c; }
    #storage-indicator[data-state="dirty"] { color: #dad45e; }
    #storage-indicator[data-state="dirty"] #storage-dot { background: #d27d2c; }
    #storage-indicator[data-state="saving"] #storage-dot { background: #6dc2ca; }
    #storage-indicator[data-state="error"] { color: #deeed6; border-color: #d04648; }
    #storage-indicator[data-state="error"] #storage-dot { background: #d04648; }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <strong>kri</strong>
      <span id="status">loading…</span>
    </div>
  </div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="storage-indicator" data-state="saving" hidden>
    <span id="storage-dot"></span>
    <span id="storage-text">loading local storage…</span>
  </div>
  <script src="coi-serviceworker.js"></script>
  <script>
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: (text) => {
        if (!text) {
          loading.hidden = true;
        } else {
          status.textContent = text;
        }
      }
    };
  </script>
  <!-- Keep Emscripten's required script placeholder inert. The real script is
       loaded below only after the service worker has isolated this page. -->
  <template id="emscripten-script">{{{ SCRIPT }}}</template>
  <script>
    if (window.crossOriginIsolated || !('serviceWorker' in navigator)) {
      const furnaceScript = document.createElement('script');
      furnaceScript.src = 'furnace.js';
      furnaceScript.async = true;
      document.body.appendChild(furnaceScript);
    }
  </script>
</body>
</html>
