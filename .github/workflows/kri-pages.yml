name: build and deploy kri

on:
  push:
    branches:
      - kri
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EM_VERSION: 5.0.1
  EM_CACHE: ${{ github.workspace }}/.emscripten-cache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: show compiler version
        run: emcc --version

      - name: cache emscripten compiler
        uses: actions/cache@v4
        with:
          path: .emscripten-cache
          key: kri-emcache-v2-${{ env.EM_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kri-emcache-v2-${{ env.EM_VERSION }}-${{ runner.os }}-

      - name: build web edition
        run: ./scripts/build-web-kri.sh

      - name: prepare site
        run: |
          mkdir --parents _site
          install --mode=0644 build/web-kri/furnace.html _site/index.html
          install --mode=0644 build/web-kri/furnace.js _site/furnace.js
          install --mode=0644 build/web-kri/furnace.wasm _site/furnace.wasm
          touch _site/.nojekyll

      - name: configure github pages
        uses: actions/configure-pages@v5

      - name: upload github pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
