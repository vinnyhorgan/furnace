name: Build and deploy Commander X16 web edition

on:
  push:
    branches:
      - x16-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EM_VERSION: 5.0.1
  EM_CACHE: ${{ github.workspace }}/.emscripten-cache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Show compiler version
        run: emcc --version

      - name: Cache compiler and build outputs
        uses: actions/cache@v4
        with:
          path: |
            .emscripten-cache
            build/web-x16
          key: x16-web-${{ env.EM_VERSION }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'scripts/build-web-x16.sh') }}-${{ github.sha }}
          restore-keys: |
            x16-web-${{ env.EM_VERSION }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'scripts/build-web-x16.sh') }}-
            x16-web-${{ env.EM_VERSION }}-${{ runner.os }}-

      - name: Build web edition
        run: ./scripts/build-web-x16.sh

      - name: Prepare site
        run: |
          mkdir --parents _site
          install --mode=0644 build/web-x16/furnace.html _site/index.html
          install --mode=0644 build/web-x16/furnace.js _site/furnace.js
          install --mode=0644 build/web-x16/furnace.wasm _site/furnace.wasm
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
